name: Weekly GA4 Tables

on:
  schedule:
    # 每周一北京时间 9:00 = UTC 周一 1:00（主调度；GitHub 可能延迟数小时）
    - cron: '0 1 * * 1'
    # 兜底：若主调度被跳过/延迟过久，周一 14:00 北京时间再补一次；已生成本周则自动跳过
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Skip if this week already generated (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import csv, datetime as dt, os
          p = 'data/analysis/方案增长总览.csv'
          if not os.path.exists(p):
              print('Proceed: no existing tables')
              raise SystemExit(0)
          rows = list(csv.DictReader(open(p, encoding='utf-8')))
          if not rows:
              print('Proceed: empty tables')
              raise SystemExit(0)
          today = dt.date.today()
          this_sunday = today - dt.timedelta(days=today.weekday() + 1)
          latest = rows[-1]['week_ending'].strip()
          if latest >= this_sunday.isoformat():
              print(f'Skip: latest week {latest} already generated for {this_sunday.isoformat()}')
              raise SystemExit(0)
          print(f'Proceed: latest week {latest} < expected {this_sunday.isoformat()}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          echo "$GA4_SA_JSON" > /tmp/sa.json
          echo "GA4_AUTH_MODE=service_account" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV
          echo "CLOUDSDK_PYTHON=python3" >> $GITHUB_ENV

      - name: Fetch GA4 data (42 days)
        run: python3 scripts/ga4_fetch.py --days 42

      - name: Generate weekly tables
        run: python3 scripts/generate_tables_correct.py --start 2026-06-01

      - name: Generate v3 solution-area tables (last 20 complete weeks)
        run: python3 scripts/generate_tables_v3.py --weeks 20

      - name: Merge LeadApi leads into weekly tables
        env:
          LEAD_SEARCH_KEY: ${{ secrets.LEAD_SEARCH_KEY }}
        run: python3 scripts/merge_leads.py

      - name: Build v3 outbound tables (01/02 + 参考设计Top3, incl. leads)
        run: python3 scripts/build_v3_tables.py --no-partial

      - name: Build 03 funnel table from v3 data (口径与 02 同源, 23 方案)
        run: python3 scripts/build_funnel.py

      - name: Export weekly JSON and stable CSV files for Feishu/Pages
        run: |
          mkdir -p dashboard/data/weekly
          cp data/analysis/方案增长总览.csv dashboard/data/weekly/
          cp data/analysis/单方案流量明细.csv dashboard/data/weekly/
          cp data/analysis/转换漏斗.csv dashboard/data/weekly/
          python3 scripts/export_weekly_json.py

      - name: Export weekly Excel
        run: python3 scripts/export_weekly_excel.py

      - name: Render dashboard from latest data
        run: python3 scripts/render_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/data/latest.json dashboard/data/latest.csv dashboard/data/weekly/ dashboard/index.html
          git add -f exports/ || true
          git commit -m "Weekly GA4 tables update $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
