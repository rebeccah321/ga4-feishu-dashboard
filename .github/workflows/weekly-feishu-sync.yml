name: Weekly Feishu Sync

on:
  workflow_dispatch:
  schedule:
    # 每周一 09:30 Asia/Shanghai 兜底（在周报 workflow 之后）
    - cron: "30 1 * * 1"
  workflow_run:
    workflows: ["Weekly GA4 Tables"]
    types: [completed]

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync weekly tables to existing Feishu tables
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
        run: python3 scripts/sync_weekly_feishu.py
