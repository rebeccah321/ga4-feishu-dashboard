<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GA4 Weekly Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --blue: #2f6fed;
      --green: #0f9f6e;
      --red: #cf423b;
      --gold: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      padding: 24px 28px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    main { padding: 20px 28px 32px; display: grid; gap: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 12px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .value { font-size: 24px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    canvas { width: 100%; min-height: 280px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    @media (max-width: 900px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .kpis, .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GA4 Weekly Dashboard</h1>
    <div class="sub">Last loaded: 2026-07-28 08:59:06</div>
  </header>
  <main>
    <section class="kpis">
      <div class="card"><div class="label">Views</div><div class="value" id="views"></div></div>
      <div class="card"><div class="label">Active Users</div><div class="value" id="users"></div></div>
      <div class="card"><div class="label">Sessions</div><div class="value" id="sessions"></div></div>
      <div class="card"><div class="label">Conversions</div><div class="value" id="conversions"></div></div>
      <div class="card"><div class="label">Revenue</div><div class="value" id="revenue"></div></div>
    </section>
    <section class="grid">
      <div class="card"><div class="label">Views by Day</div><canvas id="dayChart"></canvas></div>
      <div class="card"><div class="label">Views by Channel</div><canvas id="channelChart"></canvas></div>
    </section>
    <section class="card">
      <div class="label">Top Pages</div>
      <table>
        <thead><tr><th>Page Path</th><th>Views</th></tr></thead>
        <tbody id="topPages"></tbody>
      </table>
    </section>
  </main>
  <script>
    const data = {"total_views": 2680048, "active_users": 1087293, "sessions": 1162076, "conversions": 59943, "revenue": 2189868.1600000006, "by_day": {"2026-06-30": 107231, "2026-07-01": 102400, "2026-07-02": 106501, "2026-07-03": 106744, "2026-07-04": 78379, "2026-07-05": 76438, "2026-07-06": 100576, "2026-07-07": 102354, "2026-07-08": 98356, "2026-07-09": 97141, "2026-07-10": 105191, "2026-07-11": 85488, "2026-07-12": 77565, "2026-07-13": 96450, "2026-07-14": 107493, "2026-07-15": 109236, "2026-07-16": 104669, "2026-07-17": 95741, "2026-07-18": 84811, "2026-07-19": 81170, "2026-07-20": 90553, "2026-07-21": 102019, "2026-07-22": 109006, "2026-07-23": 101653, "2026-07-24": 104653, "2026-07-25": 84880, "2026-07-26": 75066, "2026-07-27": 88284}, "by_channel": {"Direct": 845154, "Organic Search": 700379, "Unassigned": 249623, "Referral": 248116, "Paid Search": 212557, "Cross-network": 142994, "Email": 105350, "Organic Video": 60710, "Paid Shopping": 45104, "Organic Social": 34738, "AI Assistant": 14517, "Display": 12032, "Organic Shopping": 8774}, "top_pages": {"/": 110049, "/checkout/cart/": 78809, "/SenseCAP-Card-Tracker-T1000-E-for-Meshtastic-p-5913.html": 59314, "/XIAO-nRF52840-Wio-SX1262-Kit-for-Meshtastic-p-6400.html": 39530, "/Wio-Tracker-L1-Pro-p-6454.html": 33626, "/SenseCAP-Solar-Node-P1-Pro-for-Meshtastic-LoRa-p-6412.html": 33353, "/reTerminal-E1002-p-6533.html": 32601, "/XIAO-ESP32S3-Sense-p-5639.html": 32571, "/reTerminal-E1001-p-6534.html": 31275, "/us_warehouse": 30999}};
    const fmt = new Intl.NumberFormat("en-US");
    document.getElementById("views").textContent = fmt.format(data.total_views);
    document.getElementById("users").textContent = fmt.format(data.active_users);
    document.getElementById("sessions").textContent = fmt.format(data.sessions);
    document.getElementById("conversions").textContent = fmt.format(data.conversions);
    document.getElementById("revenue").textContent = "$" + fmt.format(Math.round(data.revenue));
    new Chart(document.getElementById("dayChart"), {
      type: "line",
      data: { labels: Object.keys(data.by_day), datasets: [{ label: "Views", data: Object.values(data.by_day), borderColor: "#2f6fed", backgroundColor: "rgba(47,111,237,.12)", tension: .25, fill: true }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
    new Chart(document.getElementById("channelChart"), {
      type: "bar",
      data: { labels: Object.keys(data.by_channel), datasets: [{ label: "Views", data: Object.values(data.by_channel), backgroundColor: "#0f9f6e" }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
    document.getElementById("topPages").innerHTML = Object.entries(data.top_pages)
      .map(([path, views]) => `<tr><td>${path}</td><td>${fmt.format(views)}</td></tr>`).join("");
  </script>
</body>
</html>
